version: "3.8"

services:
  resume-optimizer-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-optimizer-api
    ports:
      - "8109:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  resume-optimizer-dashboard:
    image: nginx:alpine
    container_name: resume-optimizer-dashboard
    ports:
      - "8110:80"
    volumes:
      - ./src/dashboard/public:/usr/share/nginx/html
    restart: unless-stopped
